name: Build Vita VPK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y git cmake make
      - name: Install vita2d and dependencies
        run: vdpm vita2d
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake
      - name: Build
        run: cmake --build build --verbose
      - name: List build output
        run: find build -maxdepth 2 -type f
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: metatft-vita-vpk
          path: build/metatft_vita.vpk
          if-no-files-found: error
